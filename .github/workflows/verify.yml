name: verify
on: [push, pull_request]
permissions:
  contents: read
jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v6
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run verify
      - run: npx playwright install --with-deps chromium
      - run: BROWSER_CAPTURE=1 BROWSER_RECORD_SECONDS=65 BROWSER_EXPORT=1 npm run test:browser
      - run: npm run test:media
      - run: npm run test:selection
      - run: npm run test:markers
      - run: LIFECYCLE_CRASH=1 npm run test:lifecycle
      - name: scan full history without credentials or a license
        run: docker run --rm -v "$PWD:/repo" ghcr.io/gitleaks/gitleaks:v8.30.1 git /repo --redact --no-banner
